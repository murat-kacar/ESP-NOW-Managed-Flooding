# CI build variant (ADR 0018): turns on the optional features that the default build leaves out, so their code is
# compiled too. Applied after sdkconfig.defaults by tools/build.py --config.
CONFIG_DB_WIFI_LONG_RANGE=y
CONFIG_DB_WIFI_LR_RATE_500K=y
CONFIG_DB_FORWARD_RSSI_FILTER=y
CONFIG_DB_FILTER_WEAK_SIGNAL=y
CONFIG_DB_WIFI_COUNTRY_OVERRIDE=y
CONFIG_DB_WIFI_COUNTRY_CODE="TR"
